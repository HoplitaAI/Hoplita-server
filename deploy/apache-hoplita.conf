
<VirtualHost *:443>
    ServerName example.com
    ServerAlias www.example.com

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/example.com/privkey.pem

    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On

    ProxyPass        /health  !
    RedirectMatch 404 ^/health$

    ProxyPass        /ws/  ws://127.0.0.1:8600/ws/
    ProxyPassReverse /ws/  ws://127.0.0.1:8600/ws/

    ProxyPass        /     http://127.0.0.1:8600/
    ProxyPassReverse /     http://127.0.0.1:8600/

    ProxyTimeout 3600

    ErrorLog  /var/log/httpd/hoplita-fed-error.log
    CustomLog /var/log/httpd/hoplita-fed-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName example.com
    ServerAlias www.example.com
    Redirect permanent / https://example.com/
</VirtualHost>
